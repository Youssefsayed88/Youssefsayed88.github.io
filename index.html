<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Youssef Mohamed — Showroom</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <canvas class="webgl"></canvas>

  <div class="hud">
    <div class="hud__room" id="room-label">Corridor</div>
    <div class="hud__center">
      <div class="hud__prompt" id="prompt" hidden></div>
      <div class="hud__hint" id="hint">WASD / arrows to move &middot; drag to look &middot; space to jump</div>
    </div>
  </div>

  <a class="skip-link" href="./classic.html">Skip the game &rarr;</a>

  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop"></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal__close" type="button" aria-label="Close">&times;</button>
      <div class="modal__media"></div>
      <div class="modal__body"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
