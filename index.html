<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Youssef Mohamed — Unity Game Developer</title>
  <meta name="description" content="An explorable 3D showroom of Unity, XR and digital-twin work by Youssef Mohamed, Unity Game Developer in Cairo.">
  <meta name="theme-color" content="#1a1f2e">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">

  <meta property="og:title" content="Youssef Mohamed — Unity Game Developer">
  <meta property="og:description" content="Walk through an interactive showroom of shipped games, XR training and digital-twin projects.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <!-- og:url and og:image are injected from OWNER.site by vite.config.js: they
       must be ABSOLUTE for any share card to resolve them, and hardcoding the
       origin here would be a second place to update when the site moves. -->

  <!-- No canonical to classic.html: Vite resolves link hrefs as assets and would
       emit a second copy of the page. Crawlers reach it via the visible link
       below, and it carries its own title/description/OG tags. -->

  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <canvas class="webgl"></canvas>

  <div class="loader" id="loader">
    <div class="loader__inner">
      <div class="loader__bar"><span></span></div>
      <p class="loader__text">Building the showroom…</p>
      <a class="loader__skip" href="./classic.html">or read the plain version</a>
    </div>
  </div>

  <div class="hud">
    <div class="hud__room" id="room-label">Corridor</div>
    <div class="hud__center">
      <div class="hud__prompt" id="prompt" hidden></div>
      <div class="hud__hint" id="hint">WASD / arrows to move &middot; shift to sprint &middot; drag to look &middot; space to jump</div>
    </div>
  </div>

  <div class="controls">
    <button class="controls__btn" id="mute" type="button" aria-pressed="true">Sound on</button>
    <a class="controls__btn" href="./classic.html">Skip the game &rarr;</a>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop"></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal__close" type="button" aria-label="Close">&times;</button>
      <div class="modal__media"></div>
      <div class="modal__body"></div>
    </div>
  </div>

  <noscript>
    <div class="noscript">
      This showroom needs JavaScript. <a href="./classic.html">Read the plain version instead.</a>
    </div>
  </noscript>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
