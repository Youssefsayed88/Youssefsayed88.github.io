<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- maximum-scale/user-scalable: the platformer is a game, and a zoomed-in
       viewport pushes the joystick and the Jump button off the edge with no way
       to scroll them back. classic.html keeps its zoom, because that one IS a
       document. See src/ui/zoom.js for the two halves this tag cannot do. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ee">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">

  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <!-- The title, description, og:url and og:image are injected from OWNER by
       vite.config.js. The URLs must be ABSOLUTE for any share card to resolve
       them, and the title has to say what classic.html says. -->

  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <!-- The level: the whole portfolio as ordinary markup, generated from
       src/data by src/level/markup.js and injected here by vite.config.js.
       Every block in it is a platform. On screen at first paint, readable with
       JavaScript off, and the h1 is in the HTML a crawler sees. -->
  <!--LEVEL-->

  <p class="wip">Work in progress</p>

  <div class="hud">
    <div class="hud__room" id="room-label">About</div>
    <div class="hud__hint" id="hint">&larr; &rarr; to run &middot; shift to sprint &middot; space to jump &middot; &darr; to drop through</div>
  </div>

  <div class="controls">
    <button class="controls__btn" id="mute" type="button" aria-pressed="true">Sound on</button>
    <!-- Filled from OWNER.cv by vite.config.js. Removed entirely if unset. -->
    <!--CV_LINK-->
    <!-- The way out to the plain page, and the one control here that is not
         about the game. What a recruiter with four minutes wants, so it does
         not look like the two beside it — see .controls__btn--exit. -->
    <a class="controls__btn controls__btn--exit" href="./classic.html"><!--LABEL_BASIC--></a>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop"></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal__close" type="button" aria-label="Close">&times;</button>
      <div class="modal__media"></div>
      <div class="modal__body"></div>
    </div>
  </div>

  <noscript>
    <div class="noscript">
      The platformer needs JavaScript, but everything is still here to scroll through &mdash; or <a href="./classic.html">read the plain version</a>.
    </div>
  </noscript>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
