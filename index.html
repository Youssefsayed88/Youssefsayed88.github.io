<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- maximum-scale/user-scalable: the showroom is a game, not a document. A
       pinch on the canvas is already a look-drag, and a zoomed-in viewport
       pushes the joystick and the Open button off the edge with no way to
       scroll them back. classic.html keeps its zoom, because that one IS a
       document. See src/ui/zoom.js for the two halves this tag cannot do. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a1f2e">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">

  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <!-- The title, description, og:url and og:image are injected from OWNER by
       vite.config.js. The URLs must be ABSOLUTE for any share card to resolve
       them, and the title has to say what classic.html says: both were a second
       place to edit when OWNER changed, and the title had already drifted. -->

  <!-- No canonical to classic.html: Vite resolves link hrefs as assets and would
       emit a second copy of the page. Crawlers reach it via the visible link
       below, and it carries its own title/description/OG tags. -->

  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <canvas class="webgl"></canvas>

  <div class="loader" id="loader">
    <div class="loader__inner">
      <div class="loader__bar"><span></span></div>
      <p class="loader__text">Building the showroom…</p>
      <a class="loader__skip" href="./classic.html">or read the plain version</a>
    </div>
  </div>

  <div class="hud">
    <div class="hud__room" id="room-label">Corridor</div>
    <div class="hud__center">
      <button class="hud__prompt" id="prompt" type="button" hidden></button>
      <div class="hud__hint" id="hint">WASD / arrows to move &middot; shift to sprint &middot; drag to look &middot; space to jump</div>
    </div>
  </div>

  <div class="controls">
    <button class="controls__btn" id="mute" type="button" aria-pressed="true">Sound on</button>
    <!-- Filled from OWNER.cv by vite.config.js, for the same reason the title
         is: the filename is data, and this must not become a second copy of it.
         Removed entirely if OWNER.cv is unset. -->
    <!--CV_LINK-->
    <a class="controls__btn" href="./classic.html">Skip the game &rarr;</a>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop"></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal__close" type="button" aria-label="Close">&times;</button>
      <div class="modal__media"></div>
      <div class="modal__body"></div>
    </div>
  </div>

  <!-- Held in portrait on a phone or tablet? Turn it. In the markup rather
       than built by JS, so a CSS media query alone can raise it over the
       loading screen before any of the engine has arrived. The button is
       revealed by src/ui/Orientation.js only where the orientation lock it
       calls actually exists. -->
  <div class="rotate" id="rotate">
    <div class="rotate__inner">
      <div class="rotate__phone" aria-hidden="true"></div>
      <p class="rotate__text">Turn your device sideways</p>
      <p class="rotate__sub">The showroom is built for a landscape screen.</p>
      <button class="rotate__btn" id="rotate-lock" type="button" hidden>Rotate it for me</button>
      <a class="rotate__skip" href="./classic.html">or read the plain version</a>
    </div>
  </div>

  <noscript>
    <div class="noscript">
      This showroom needs JavaScript. <a href="./classic.html">Read the plain version instead.</a>
    </div>
  </noscript>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
