<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- maximum-scale/user-scalable: the platformer is a game, and a zoomed-in
       viewport pushes the joystick and the Jump button off the edge with no way
       to scroll them back. classic.html keeps its zoom, because that one IS a
       document. See src/ui/zoom.js for the two halves this tag cannot do. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ee">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">

  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <!-- The title, description, og:url and og:image are injected from OWNER by
       vite.config.js. The URLs must be ABSOLUTE for any share card to resolve
       them, and the title has to say what classic.html says. -->

  <!-- The visitor's theme, if they picked one, before anything paints. Without
       it the system setting applies through the stylesheet. See src/ui/theme.js. -->
  <script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <!-- Asks which portfolio unless the link already chose. See doorMarkup in
       src/level/markup.js; injected by vite.config.js. -->
  <!--DOOR_CHECK-->
  <!-- PostHog, cookieless, live site only; see src/core/analytics.js. Nothing
       at all when the build has no token. -->
  <!--ANALYTICS-->
  <!-- Where the chatbot's Worker is; nothing, and no chat, without CHAT_URL.
       See src/chat/config.js. -->
  <!--CHAT_META-->
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <a class="skip-link" href="./classic.html">Skip the game: read the plain portfolio</a>

  <!--DOOR-->

  <!-- The level: the whole portfolio as ordinary markup, generated from
       src/data by src/level/markup.js and injected here by vite.config.js.
       Every block in it is a platform. On screen at first paint, readable with
       JavaScript off, and the h1 is in the HTML a crawler sees. -->
  <!--LEVEL-->

  <!-- The sections down the right side. See railMarkup in src/level/markup.js. -->
  <!--RAIL-->

  <p class="wip">Work in progress</p>

  <div class="hud">
    <div class="hud__room" id="room-label">About</div>
    <div class="hud__hint" id="hint">&larr; &rarr; to run &middot; shift to sprint &middot; space to jump &middot; &darr; to drop through</div>
  </div>

  <div class="controls">
    <button class="controls__btn controls__btn--icon theme-toggle" id="theme" type="button" aria-label="Switch to dark theme" hidden>
      <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg>
      <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="controls__btn" id="mute" type="button" aria-pressed="true">Sound on</button>
    <!-- The chatbot, when the build has one. See src/chat/markup.js. -->
    <!--CHAT_BUTTON-->
    <!-- Filled from OWNER.cv by vite.config.js. Removed entirely if unset. -->
    <!--CV_LINK-->
    <!-- The way out to the plain page, and the one control here that is not
         about the game. What a recruiter with four minutes wants, so it does
         not look like the two beside it — see .controls__btn--exit. -->
    <!--EXIT_LINK-->
  </div>

  <!--CHAT_DOCK-->

  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop"></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal__close" type="button" aria-label="Close">&times;</button>
      <div class="modal__media"></div>
      <div class="modal__body"></div>
    </div>
  </div>

  <noscript>
    <div class="noscript">
      The platformer needs JavaScript, but everything is still here to scroll through &mdash; or <a href="./classic.html">read the plain version</a>.
    </div>
  </noscript>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
