name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Physics and layout checks run headless, so a broken level fails the deploy.
      - run: npm test
      - run: npm run build
      # No enablement: true here. GitHub auto-enables Pages on a <user>.github.io
      # repo using the LEGACY branch builder, which serves the repo root verbatim
      # rather than dist/ -- and configure-pages then fails against that existing
      # config, taking the build job with it. Source must be set to
      # "GitHub Actions" in Settings -> Pages once, by hand.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
